[program:remindly-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/remindly/artisan queue:work redis --sleep=3 --tries=5 --timeout=540
directory=/var/www/remindly
user=www-data
autostart=true
autorestart=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/remindly/storage/logs/worker.log
stopasgroup=true
killasgroup=true
